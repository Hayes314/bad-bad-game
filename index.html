function makeAlly(x, y) {
  const cfg = mode.allyConfig;
  return {
    x, y, r:12, hp:cfg.maxHp, maxHp:cfg.maxHp,
    speed: cfg.speed, angle:0,
    atk: cfg.atk,
    attackCd:0, hurt:0, dead:false, name: pick(mode.allyNames),
    punchT:0, revivable: warActive, reviving: false
  };
}

function addAlly(x, y, revivable) {
  const limit = warActive ? maxAlliesWar : MAX_ALLIES;
  if (allies.length >= limit) return false;
  if (x === undefined) x = player.x + rand(-40,40);
  if (y === undefined) y = player.y + rand(-40,40);
  const a = makeAlly(x, y);
  if (revivable !== undefined) a.revivable = revivable;
  allies.push(a);
  for (let i=0;i<14;i++) spawnParticle(x,y,rand(0,Math.PI*2),rand(40,220),'212,175,55',rand(0.2,0.5),rand(2,4));
  return true;
}

function makeWorker(x, y) {
  return {
    x: x!==undefined?x:SUBMAP_CENTER_X+rand(-80,80),
    y: y!==undefined?y:SUBMAP_CENTER_Y+rand(-80,80),

const keys = {};

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (gameOver && e.code === 'KeyR' && currentMap === 'city' && screen === 'game' && !warActive) init();
  if (pausedForUpgrade && currentMap === 'city') {
    if (e.code === 'Digit1') selectUpgrade(0);
    if (e.code === 'Digit2') selectUpgrade(1);
    if (e.code === 'Digit3') selectUpgrade(2);
  }
  initAudio();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

window.addEventListener('mousemove', e => {
  if (performance.now() - lastTouchTime < 600) return;
  isTouchMode = false; mouse.x = e.clientX; mouse.y = e.clientY;
});
window.addEventListener('mousedown', e => {
  if (e.button === 0) { mouse.down = true; if (!isTouchMode) initAudio(); handleClick(e.clientX, e.clientY); }
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => {
  mouse.down = false;
  for (const k in keys) keys[k] = false;
  resetSticks();
});

function resetSticks() {
  moveStick.active = false; moveStick.id = null; moveStick.dx = moveStick.dy = 0;
  aimStick.active = false; aimStick.id = null; aimStick.dx = aimStick.dy = 0;
}

function updateStick(s, x, y) {
  let dx = x - s.baseX, dy = y - s.baseY;
  const d = Math.hypot(dx, dy);
  if (d > STICK_RADIUS) { dx = (dx/d)*STICK_RADIUS; dy = (dy/d)*STICK_RADIUS; }
  s.curX = s.baseX + dx; s.curY = s.baseY + dy;
  s.dx = dx/STICK_RADIUS; s.dy = dy/STICK_RADIUS;
}

function onTouchStart(e) {
  e.preventDefault();
  lastTouchTime = performance.now();
  isTouchMode = true; initAudio();
  for (const t of e.changedTouches) handleClick(t.clientX, t.clientY);
  if (screen !== 'game' || shopOpen || pausedForUpgrade || gameOver || currentMap !== 'city') return;
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (dist(x, y, dashBtn.x, dashBtn.y) < dashBtn.r + 10) { tryDash(); continue; }
    if (x < W/2) {
      if (!moveStick.active) { moveStick.active = true; moveStick.id = t.identifier; moveStick.baseX = x; moveStick.baseY = y; moveStick.curX = x; moveStick.curY = y; moveStick.dx = 0; moveStick.dy = 0; }
    } else {
      if (!aimStick.active) { aimStick.active = true; aimStick.id = t.identifier; aimStick.baseX = x; aimStick.baseY = y; aimStick.curX = x; aimStick.curY = y; aimStick.dx = 0; aimStick.dy = 0; }
    }
  }
}

function onTouchMove(e) {
  e.preventDefault();
  lastTouchTime = performance.now();
  for (const t of e.changedTouches) {
    if (moveStick.active && t.identifier === moveStick.id) updateStick(moveStick, t.clientX, t.clientY);
    else if (aimStick.active && t.identifier === aimStick.id) updateStick(aimStick, t.clientX, t.clientY);
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (moveStick.active && t.identifier === moveStick.id) { moveStick.active = false; moveStick.id = null; moveStick.dx = 0; moveStick.dy = 0; }
    if (aimStick.active && t.identifier === aimStick.id) { aimStick.active = false; aimStick.id = null; aimStick.dx = 0; aimStick.dy = 0; }
  }
}

window.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchEnd, { passive: false });

let actx = null, noiseBuf = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(actx.sampleRate * 0.4);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  } catch (e) { actx = null; }
}
function sfxShot(vol, pitch) {
  if (!actx) return;
  vol = vol||0.13; pitch = pitch||1;
  const t = actx.currentTime;
  const src = actx.createBufferSource();
  src.buffer = noiseBuf; src.playbackRate.value = pitch;
  const f = actx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.setValueAtTime(1700*pitch, t);
  f.frequency.exponentialRampToValueAtTime(380, t+0.09); f.Q.value = 0.7;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.13);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t); src.stop(t+0.16);
}
function sfxHit(vol) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'square';
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(60, t+0.08);
  const g = actx.createGain(); g.gain.setValueAtTime(vol||0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.12);
}
function sfxCash() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t+0.06);
  const g = actx.createGain(); g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.18);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.2);
}
function sfxWhip() {
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 2.5;
  const f = actx.createBiquadFilter(); f.type = 'highpass';
  f.frequency.setValueAtTime(2000, t); f.frequency.exponentialRampToValueAtTime(500, t+0.08);
  const g = actx.createGain(); g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.12);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t); src.stop(t+0.14);
}
function sfxFaith() {
  if (!actx) return;
  const t = actx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(freq, t+i*0.04);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.06, t+i*0.04);
    g.gain.exponentialRampToValueAtTime(0.001, t+i*0.04+0.2);
    o.connect(g); g.connect(actx.destination);
    o.start(t+i*0.04); o.stop(t+i*0.04+0.22);
  });
}
function sfxWar() {
  if (!actx) return;
  const t = actx.currentTime;
  [196, 147, 98].forEach((freq, i) => {
    const o = actx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, t+i*0.15);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.1, t+i*0.15);
    g.gain.exponentialRampToValueAtTime(0.001, t+i*0.15+0.3);
    o.connect(g); g.connect(actx.destination);
    o.start(t+i*0.15); o.stop(t+i*0.15+0.32);
  });
}

function makeBuilding(x, y, w, h) {
  const tints = ['#2e241c','#352a1f','#28221c','#332a1e','#2b2620','#383028','#302a20'];
  const b = { x,y,w,h, col: pick(tints), details:[] };
  const n = randInt(1,3);
  for (let i=0;i<n;i++) {
    const dw = rand(12, Math.min(46, w*0.45));
    const dh = rand(12, Math.min(46, h*0.45));
    if (w-dw < 20 || h-dh < 20) continue;
    b.details.push({ x:x+rand(8,w-dw-8), y:y+rand(8,h-dh-8), w:dw, h:dh, t: Math.random()<0.55?'vent':'sky' });
  }
  return b;
}

function genWorld() {
  buildings = []; lamps = [];
  for (let bx=0;bx<GRID_N;bx++) for (let by=0;by<GRID_N;by++) {
    const x0 = bx*BLOCK+ROAD/2, y0 = by*BLOCK+ROAD/2;
    const size = BLOCK-ROAD, cw = size/2, ch = size/2;
    for (let i=0;i<2;i++) for (let j=0;j<2;j++) {
      const px = rand(16,34), py = rand(16,34);
      const x = x0+i*cw+px, y = y0+j*ch+py;
      const w = cw-px*2, h = ch-py*2;
      if (w < 44 || h < 44) continue;
      buildings.push(makeBuilding(x,y,w,h));
    }
  }
  for (let bx=0;bx<=GRID_N;bx++) for (let by=0;by<=GRID_N;by++) lamps.push({ x:bx*BLOCK, y:by*BLOCK });
}

function initSubMap(mapState, type) {
  mapState.nodes = [];
  for (let i=0;i<16;i++) {
    let x, y, tries = 0;
    do { x = rand(160, FARM_MAP_W-160); y = rand(160, FARM_MAP_H-160); tries++; }
    while (tries < 30 && dist(x,y,SUBMAP_CENTER_X,SUBMAP_CENTER_Y) < 180);
    mapState.nodes.push({ x, y, r:16, amount:3, respawnTimer:0, type });
  }
  mapState.lastUpdate = performance.now();
}

function addTransport(type, opts) {
  transports.push(Object.assign({ type, timer:TRANSPORT_TIME, maxTime:TRANSPORT_TIME }, opts||{}));
}

function updateTransports(dt) {
  for (let i=transports.length-1;i>=0;i--) {
    const t = transports[i];
    t.timer -= dt;
    if (t.timer <= 0) {
      if (t.type === 'ally-to-farm') for (let j=0;j<t.count;j++) farm.allies.push(makeWorker());
      else if (t.type === 'ally-to-mine') for (let j=0;j<t.count;j++) mine.allies.push(makeWorker());
      else if (t.type === 'ally-to-city') {
        const space = (warActive ? maxAlliesWar : MAX_ALLIES) - allies.length;
        const actual = Math.min(t.count, space);
        for (let j=0;j<actual;j++) addAlly(player.x+rand(-40,40), player.y+rand(-40,40), warActive);
        const extra = t.count - actual;
        if (extra > 0) {
          const back = t.from === 'farm' ? farm : mine;
          for (let j=0;j<extra;j++) back.allies.push(makeWorker());
        }
      } else if (t.type === 'resource') {
        const cfg = t.resourceType === 'farm' ? mode.subMaps.farm : mode.subMaps.mine;
        money += Math.floor(t.amount * cfg.price);
        sfxCash();
      }
      transports.splice(i, 1);
    }
  }
}

function useBoost(mapState) {
  const boost = mode.boost;
  if (mapState.boostCooldown > 0) return;
  if (boost.type === 'whip') {
    if (mapState.allies.length === 0) return;
    mapState.boostStacks = Math.min(mapState.boostStacks+1, boost.maxStacks);
    mapState.boostTimer = boost.duration; mapState.whipFlash = 0.45;
    sfxWhip();
    for (const a of mapState.allies) {
      a.hp -= boost.hpCost; a.hurtT = 0.45;
      for (let k=0;k<6;k++) spawnParticle(a.x,a.y,rand(-Math.PI*0.8,-Math.PI*0.2),rand(60,200),'200,30,20',rand(0.3,0.6),rand(2,4));
      for (let k=0;k<4;k++) spawnParticle(a.x,a.y-a.r-6,rand(0,Math.PI*2),rand(80,160),'255,220,180',rand(0.15,0.3),rand(1.5,3));
      if (a.hp <= 0) { a.hp = 0; a.dead = true; }
    }
  } else if (boost.type === 'money') {
    if (money < boost.cost) return;
    money -= boost.cost;
    mapState.boostStacks = Math.min(mapState.boostStacks+1, boost.maxStacks);
    mapState.boostTimer = boost.duration; mapState.whipFlash = 0.25;
    sfxCash();
  } else if (boost.type === 'faith') {
    mapState.boostCooldown = boost.cooldown;
    mapState.boostStacks = Math.min(mapState.boostStacks+1, boost.maxStacks);
    mapState.boostTimer = boost.duration; mapState.whipFlash = 0.2;
    sfxFaith();
  }
}

function updateSubMapAllies(mapState, dt) {
  if (mapState.boostTimer > 0) {
    mapState.boostTimer -= dt;
    if (mapState.boostTimer <= 0) { mapState.boostTimer = 0; mapState.boostStacks = 0; }
  }
  if (mapState.boostCooldown > 0) mapState.boostCooldown -= dt;
  if (mapState.whipFlash > 0) mapState.whipFlash -= dt;

  const boost = mode.boost;
  const speedMult = 1 + boost.boostPerStack * mapState.boostStacks;
  const collectTime = mode.workerCollectTime / speedMult;

  for (const a of mapState.allies) {
    a.bob += dt*6;
    if (a.hurtT > 0) a.hurtT -= dt;
    if (a.hp < a.maxHp) a.hp = Math.min(a.maxHp, a.hp + 3*dt);

    if (a.state === 'idle') {
      let nearest = null, nd = Infinity;
      for (const n of mapState.nodes) {
        if (n.amount <= 0) continue;
        const d = dist(a.x, a.y, n.x, n.y);
        if (d < nd) { nd = d; nearest = n; }
      }
      if (nearest) { a.targetNode = nearest; a.state = 'moving'; }
    } else if (a.state === 'moving') {
      if (!a.targetNode || a.targetNode.amount <= 0) { a.state = 'idle'; a.targetNode = null; continue; }
      const d = dist(a.x, a.y, a.targetNode.x, a.targetNode.y);
      if (d < a.r + a.targetNode.r + 4) { a.state = 'collecting'; a.collectTimer = collectTime; }
      else {
        const ang = Math.atan2(a.targetNode.y-a.y, a.targetNode.x-a.x);
        const spd = 130*speedMult;
        a.x += Math.cos(ang)*spd*dt; a.y += Math.sin(ang)*spd*dt; a.angle = ang;
      }
    } else if (a.state === 'collecting') {
      a.collectTimer -= dt;
      if (a.collectTimer <= 0) {
        if (a.targetNode && a.targetNode.amount > 0) {
          a.targetNode.amount--; mapState.warehouse++;
          if (a.targetNode.amount <= 0) a.targetNode.respawnTimer = NODE_RESPAWN;
        }
        a.state = 'idle'; a.targetNode = null;
      }
    }
  }

  for (let i=mapState.allies.length-1;i>=0;i--) {
    if (mapState.allies[i].dead) {
      const a = mapState.allies[i];
      for (let k=0;k<12;k++) spawnParticle(a.x,a.y,rand(0,Math.PI*2),rand(40,200),'120,70,40',rand(0.3,0.7),rand(2,4));
      mapState.allies.splice(i, 1);
    }
  }

  for (const n of mapState.nodes) {
    if (n.amount <= 0) { n.respawnTimer -= dt; if (n.respawnTimer <= 0) n.amount = 3; }
  }
}

function calcOffline(mapState) {
  const now = performance.now();
  const elapsed = (now - mapState.lastUpdate) / 1000;
  if (elapsed > 0.05) {
    mapState.warehouse += mapState.allies.length * 0.30 * elapsed;
    mapState.boostStacks = 0; mapState.boostTimer = 0; mapState.boostCooldown = 0;
    for (const n of mapState.nodes) {
      if (n.amount <= 0) { n.respawnTimer -= elapsed; if (n.respawnTimer <= 0) n.amount = 3; }
    }
  }
  mapState.lastUpdate = now;
}

function switchMap(target) {
  if (target === currentMap) return;
  if (currentMap === 'farm') calcOffline(farm);
  if (currentMap === 'mine') calcOffline(mine);
  currentMap = target; shopOpen = false; resetSticks();
  if (target === 'farm') farm.lastUpdate = performance.now();
  else if (target === 'mine') mine.lastUpdate = performance.now();
  else if (target === 'city') { cam.x = player.x; cam.y = player.y; }
}

function buyBullets() { if (money < 20) return; money -= 20; player.mag += 15; player.ammo = player.mag; sfxCash(); }
function buyHealth() { if (money < 15) return; money -= 15; player.hp = Math.min(player.maxHp, player.hp+30); sfxCash(); }
function buyAlly() {
  if (money < mode.allyPrice) return;
  const limit = warActive ? maxAlliesWar : MAX_ALLIES;
  if (allies.length >= limit) return;
  money -= mode.allyPrice;
  addAlly(player.x+rand(-40,40), player.y+rand(-40,40), warActive);
  sfxCash();
}
function sendAllyToFarm() { if (allies.length === 0) return; allies.pop().dead = true; addTransport('ally-to-farm', { count:1 }); }
function sendAllyToMine() { if (allies.length === 0) return; allies.pop().dead = true; addTransport('ally-to-mine', { count:1 }); }

function shipResources(mapState, resourceType) {
  const amount = Math.floor(mapState.warehouse);
  if (amount <= 0) return;
  mapState.warehouse -= amount;
  addTransport('resource', { amount, resourceType });
}

function recallAllies(mapState, from) {
  const count = mapState.allies.length;
  if (count <= 0) return;
  mapState.allies = [];
  addTransport('ally-to-city', { count, from });
}

/* ================= 发动战争 ================= */
function startWar() {
  if (warActive || money < mode.warPrice || gameOver) return;
  money -= mode.warPrice;

  const farmCount = farm.allies.length;
  const mineCount = mine.allies.length;
  farm.allies = [];
  mine.allies = [];
  const recallCount = farmCount + mineCount;

  warActive = true;
  warBosses = [];
  reviveQueue = [];

  const limit = maxAlliesWar;
  for (let i=0;i<recallCount;i++) {
    if (allies.length >= limit) break;
    addAlly(player.x+rand(-120,120), player.y+rand(-120,120), true);
  }
  for (let i=0;i<WAR_EXTRA_ALLIES;i++) {
    if (allies.length >= limit) break;
    addAlly(player.x+rand(-180,180), player.y+rand(-180,180), true);
  }

  for (const a of allies) a.revivable = true;

  spawnBosses();
  enemies = [];
  sfxWar();
  shake = 18;

  for (let i=0;i<60;i++) {
    spawnParticle(player.x, player.y, rand(0,Math.PI*2), rand(100,500), '212,175,55', rand(0.4,1.0), rand(3,6));
  }
}

function spawnBosses() {
  const boss = mode.boss;
  let unitsList = [];
  for (const u of boss.units) {
    for (let i=0;i<u.count;i++) unitsList.push(u);
  }
  const centerX = WORLD/2, centerY = WORLD/2;
  const n = unitsList.length;
  const radius = n === 1 ? 0 : Math.min(500, 180 + n*3);

  for (let i=0;i<n;i++) {
    const u = unitsList[i];
    const ang = (i/n) * Math.PI * 2;
    const x = centerX + Math.cos(ang) * radius + rand(-30,30);
    const y = centerY + Math.sin(ang) * radius + rand(-30,30);

    const hpMul = mode.diffMul.hp;
    const dmgMul = mode.diffMul.dmg;
    const speedBoost = u.speedBoost || 0;

    const e = {
      x, y, r: u.r || 14,
      hp: u.hp * hpMul, maxHp: u.hp * hpMul,
      angle: 0,
      fireCd: rand(0.5, 1.5),
      seeTimer: 0, canSee: true, alert: 99,
      wanderT: 0, wx: 0, wy: 0, hurt: 0,
      speed: u.speed * (1 + speedBoost),
      template: { name:u.name, color:u.color, dmg:u.dmg*dmgMul, range:u.range, fire:[0.8,1.6], speed:[u.speed,u.speed] },
      isElite: false,
      isBoss: true,
      isMainBoss: !!u.isMainBoss,
      name: u.name
    };
    warBosses.push(e);
  }
}

/* ================= 复活系统（只在战争中生效） ================= */
function queueRevive(deadEntity) {
  if (!warActive) return;
  reviveQueue.push({
    timer: REVIVE_TIME,
    x: deadEntity.x, y: deadEntity.y, name: deadEntity.name
  });
}

function updateReviveQueue(dt) {
  if (!warActive) { reviveQueue = []; return; }
  for (let i=reviveQueue.length-1;i>=0;i--) {
    const r = reviveQueue[i];
    r.timer -= dt;
    if (r.timer <= 0) {
      if (allies.length < maxAlliesWar) {
        const a = makeAlly(r.x + rand(-30,30), r.y + rand(-30,30));
        a.revivable = true;
        a.name = r.name || pick(mode.allyNames);
        allies.push(a);
        for (let k=0;k<14;k++) spawnParticle(a.x, a.y, rand(0,Math.PI*2), rand(60,260), '120,220,200', rand(0.2,0.5), rand(2,4));
      }
      reviveQueue.splice(i, 1);
    }
  }
}
